# Runs on every PR opened against main, verifying core quality checks pass

name: 🚦 CI Checks

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: 🔎 Detect Changes
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.filter.outputs.app }}
      workflows: ${{ steps.filter.outputs.workflows }}
    steps:
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            app:
              - 'src/**'
              - 'db/**'
              - 'Dockerfile'
              - 'start.sh'
              - 'index.html'
              - 'package*.json'
              - '.npmrc'
              - '.nvmrc'
              - 'angular.json'
              - 'vite.config.ts'
              - 'tailwind.config.js'
              - 'postcss.config.js'
              - 'tsconfig*.json'
            workflows:
              - '.github/workflows/**'

  pr-title:
    name: 📝 PR Title Check
    runs-on: ubuntu-latest
    steps:
      - name: 📝 Validate PR title (conventional commits)
        uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            chore
            docs
            style
            refactor
            perf
            test
            build
            ci
            revert
          requireScope: false
          subjectPattern: ^[A-Za-z].+$
          subjectPatternError: |
            Subject must start with a letter and not be empty.
            Example: `feat: add support for X` or `fix(api): handle Y`.

  lint:
    name: 📝 Lint
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.app == 'true'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci --legacy-peer-deps
      - run: npm run lint

  build:
    name: 🏗️ Build
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.app == 'true'
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci --legacy-peer-deps
      - name: 🏗️ Build production bundle
        env:
          NODE_OPTIONS: --max-old-space-size=8192
          DL_ENV_TYPE: selfHosted
        run: npm run build
      - name: ✅ Verify build output
        run: |
          if [ ! -f dist/analog/server/index.mjs ]; then
            echo "::error::Build failed: dist/analog/server/index.mjs not found"
            exit 1
          fi
          echo "✅ SSR entry present"

  docker-smoke:
    name: 🐳 Docker Smoke Test
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.app == 'true'
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - name: 🔌 Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🐳 Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: domain-locker:ci
          cache-from: type=gha,scope=ci-docker
          cache-to: type=gha,scope=ci-docker,mode=max

      - name: 🐘 Start Postgres
        run: |
          docker network create dl-ci
          docker run -d --name dl-ci-pg --network dl-ci \
            -e POSTGRES_DB=domain_locker \
            -e POSTGRES_USER=postgres \
            -e POSTGRES_PASSWORD=ci-test \
            postgres:16-alpine
          for i in $(seq 1 30); do
            if docker exec dl-ci-pg pg_isready -U postgres >/dev/null 2>&1; then
              echo "postgres ready after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "::error::Postgres did not become ready"
          exit 1

      - name: 🚀 Start app & probe /api/health
        run: |
          docker run -d --name dl-ci-app --network dl-ci -p 3000:3000 \
            -e DL_ENV_TYPE=selfHosted \
            -e DL_PG_HOST=dl-ci-pg \
            -e DL_PG_PORT=5432 \
            -e DL_PG_USER=postgres \
            -e DL_PG_PASSWORD=ci-test \
            -e DL_PG_NAME=domain_locker \
            domain-locker:ci

          for i in $(seq 1 60); do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/api/health || echo 000)
            if [ "$CODE" = "200" ]; then
              echo "✅ App healthy after ${i}s"
              exit 0
            fi
            sleep 2
          done

          echo "::error::App did not become healthy within 120s"
          echo "--- app logs ---"
          docker logs dl-ci-app
          echo "--- postgres logs ---"
          docker logs dl-ci-pg
          exit 1

      - name: 🧹 Tear down
        if: always()
        run: |
          docker rm -f dl-ci-app dl-ci-pg 2>/dev/null || true
          docker network rm dl-ci 2>/dev/null || true

  actionlint:
    name: 🔧 Lint Workflows
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.workflows == 'true'
    steps:
      - uses: actions/checkout@v6
      - name: 🔧 Run actionlint
        uses: raven-actions/actionlint@v2
        with:
          fail-on-error: true
